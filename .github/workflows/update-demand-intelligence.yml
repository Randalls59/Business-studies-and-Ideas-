name: Refresh Tucson demand intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-demand-intelligence.yml'
      - 'scripts/demand-v2.mjs'
      - 'scripts/demand-trigger.txt'
      - 'docs/competitor-data.json'

permissions:
  contents: write

concurrency:
  group: tucson-demand-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check SerpApi secret status
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "SERPAPI_KEY is unavailable. The demand file will still be generated from stored review and supply data with reduced confidence."
          else
            echo "SERPAPI_KEY is available to the workflow."
          fi

      - name: Build demand intelligence v2
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/demand-v2.mjs

      - name: Validate generated files
        run: |
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('docs/demand-data.json','utf8')); if(!Array.isArray(d.rankings)||d.rankings.length!==4) throw new Error('Demand ranking file is incomplete'); console.log('Validated',d.rankings.length,'concept rankings and',d.competitor_snapshot.analyzed_count,'qualified businesses.');"

      - name: Commit refreshed demand data
        run: |
          git config user.name 'Randalls59'
          git config user.email 'Randalls59@users.noreply.github.com'
          git add docs/demand-data.json docs/demand-error.json
          if git diff --cached --quiet; then
            echo 'No demand-data changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh Tucson demand intelligence'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'Demand intelligence published successfully.'
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against the latest main branch."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo 'Unable to publish demand data after three attempts.'
          exit 1

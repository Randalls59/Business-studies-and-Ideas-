name: Refresh Tucson demand intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-demand-intelligence.yml'
      - 'scripts/update-demand-intelligence.mjs'
      - 'scripts/run-demand-intelligence.mjs'
      - 'scripts/demand-trigger.txt'
      - 'docs/competitor-data.json'

permissions:
  contents: write

concurrency:
  group: tucson-demand-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check SerpApi secret status
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "SERPAPI_KEY is missing or empty. The run will create a clearly labeled review-based fallback dataset instead of failing silently."
          else
            echo "SERPAPI_KEY is available to the workflow."
          fi

      - name: Build demand intelligence
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/run-demand-intelligence.mjs

      - name: Commit refreshed demand data
        run: |
          git config user.name 'Randalls59'
          git config user.email 'Randalls59@users.noreply.github.com'
          git add docs/demand-data.json docs/demand-error.json
          if git diff --cached --quiet; then
            echo 'No demand-data changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh Tucson demand intelligence'

          # Main may advance while the API work is running. Rebase the generated
          # data commit onto the newest dashboard code before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'Demand intelligence published successfully.'
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against the latest main branch."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done

          echo 'Unable to publish demand data after three attempts.'
          exit 1
